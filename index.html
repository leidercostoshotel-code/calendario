function _getWorstBmiClass(note){
    if(note.metricType!=='peso'||!note.people||!note.people.length) return null;
    const noteKg=Number(String(note.title).trim().replace(',','.'));
    const validNoteKg=Number.isFinite(noteKg)&&noteKg>=20&&noteKg<=400?noteKg:null;
    const classMap={1:'bmi-delgadez-severa',2:'bmi-delgadez',3:'bmi-saludable',4:'bmi-sobrepeso',5:'bmi-obesidad1',6:'bmi-obesidad2',7:'bmi-obesidad3'};
    const urgencyScore=lvl=>lvl===3?0:Math.abs(lvl-3);
    let worstClass=null, worstScore=-1;
    note.people.forEach(pid=>{
        const c=contacts.find(x=>x.id===pid);
        if(!c||!c.height) return;
        const hist=c.weightHistory||[];
        const latestW=hist.length?hist[hist.length-1].weight:null;
        const w=validNoteKg||latestW;
        if(!w) return;
        const bmi=w/(c.height*c.height);
        const lvl=getBmiLevel(bmi).level;
        const score=urgencyScore(lvl);
        if(score>worstScore){worstScore=score;worstClass=classMap[lvl];}
    });
    return worstClass;
}

function renderNoteCard(n){
    const bmiClass=_getWorstBmiClass(n);
    const cardClass=(bmiClass&&!n.isRecurring)?bmiClass:`priority-${n.priority}`;
    const metricIcons={peso:'\u2696\ufe0f',presion:'\ud83e\ude7a',glucosa:'\ud83e\uddea',entrenamiento:'\ud83c\udfc3',otro:'\ud83d\udcdd'};
    const metricUnits={peso:'kg',presion:'mmHg',glucosa:'mg/dL',entrenamiento:'',otro:''};
    const mt=n.metricType||'peso';
    const icon=n.isRecurring?'\ud83c\udf82':(metricIcons[mt]||'\ud83d\udcdd');
    const unit=metricUnits[mt]||'';
    const numVal=Number(String(n.title).trim().replace(',','.'));
    const isNumeric=Number.isFinite(numVal)&&numVal>0&&!n.isRecurring&&unit;
    const dateStr=n.date?new Date(n.date+'T00:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'Fecha no definida';
    const priorityLabels={baja:'\ud83d\udfe2 Normal',media:'\ud83d\udfe1 Atenci\u00f3n',alta:'\ud83d\udd34 Urgente'};
    const priorityLabel=priorityLabels[n.priority]||'\u2014';
    return `<div class="note-card ${cardClass} ${n.completed?'completed':''} ${n.isRecurring?'birthday':''}">
        <div class="note-actions">
            <button class="action-btn" onclick="editNote(${n.id})" title="Editar">\u270f\ufe0f</button>
            ${!n.isRecurring?`<button class="action-btn" onclick="toggleComplete(${n.id})" title="${n.completed?'Reabrir':'Completar'}">${n.completed?'\u2705':'\u2611\ufe0f'}</button>`:''}
            <button class="action-btn" onclick="deleteNote(${n.id})" title="Eliminar">\ud83d\uddd1\ufe0f</button>
        </div>
        <div class="note-card-header">
            <div class="note-metric-icon">${icon}</div>
            <div class="note-header-text">
                <div class="note-metric-label">${metricIcons[mt]?metricIcons[mt]+' ':''} ${(metricLabelMap[mt]||mt).toUpperCase()}${n.isRecurring?' \u00b7 ANUAL':''}</div>
                ${isNumeric
                    ?`<div class="note-weight-display">${numVal%1===0?numVal:numVal.toFixed(1)}<span class="note-weight-unit">${unit}</span></div>`
                    :`<div class="note-title-text">${n.title}</div>`
                }
            </div>
        </div>
        ${getPeopleHTML(n.people)}
        ${n.desc?`<div class="note-desc-block"><strong>Observaciones</strong><br>${n.desc}</div>`:''}
        ${getSmartHealthSummary(n.people, n)}
        <div class="note-divider"></div>
        <div class="note-meta-row">
            <span class="note-meta-chip">\ud83d\udcc5 ${dateStr}</span>
            <span class="note-meta-chip">${priorityLabel}</span>
            ${n.completed&&!n.isRecurring?`<span class="note-meta-chip" style="background:rgba(255,255,255,0.35);">\u2728 Completado</span>`:''}
            ${n.isRecurring?`<span class="note-meta-chip">\ud83d\udd01 Recurrente</span>`:''}
        </div>
    </div>`;
}

function renderNotes(){
    const nl=document.getElementById('notesList');
    const cy=currentDate.getFullYear(),cm=currentDate.getMonth()+1,cms=String(cm).padStart(2,'0');
    document.getElementById('notesListMonth').textContent=`(${monthNames[cm-1]} ${cy})`;
    const fn=notes.filter(n=>{if(!n.date) return false;const nm=n.date.substring(5,7),ny=n.date.substring(0,4);if(nm===cms&&ny==cy) return true;if(n.isRecurring&&nm===cms) return true;return false;});
    if(!fn.length){
        // Encuentra meses con notas y sugiere navegaci\u00f3n
        const monthsWithNotes={};
        notes.forEach(n=>{if(!n.date) return;const k=n.date.substring(0,7);monthsWithNotes[k]=(monthsWithNotes[k]||0)+1;});
        const sortedMonths=Object.keys(monthsWithNotes).sort().reverse().slice(0,6);
        const monthBtns=sortedMonths.map(k=>{
            const [y,m]=k.split('-');
            const label=monthNames[parseInt(m)-1]+' '+y;
            return `<button onclick="goToMonth(${y},${parseInt(m)-1})" style="background:var(--blue2);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:0.85em;font-weight:600;margin:4px;">${label} (${monthsWithNotes[k]})</button>`;
        }).join('');
        nl.innerHTML=`<div style="text-align:center;padding:30px 20px;">
            <p style="color:var(--gray3);font-family:var(--serif);font-style:italic;font-size:1.05em;margin-bottom:${sortedMonths.length?'18px':'0'};">No hay notas para ${monthNames[cm-1]} ${cy}. \ud83c\udf89</p>
            ${sortedMonths.length?`<p style="color:var(--gray4);font-size:0.88em;font-weight:600;margin-bottom:10px;">\ud83d\udcc5 Meses con registros:</p><div>${monthBtns}</div>`:''}
            <button onclick="showAllNotes()" style="margin-top:16px;background:linear-gradient(135deg,var(--purple2),var(--purple1));color:#fff;border:none;padding:10px 22px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:0.88em;font-weight:700;">\ud83d\udccb Ver todos los registros</button>
        </div>`;
        return;
    }

    const sortFn=(a,b)=>{if(a.isRecurring!==b.isRecurring) return a.isRecurring?-1:1;if(a.date!==b.date) return new Date(a.date)-new Date(b.date);if(a.completed!==b.completed) return a.completed?1:-1;return 0;};

    // Separate: notes with people vs without
    const withPeople=fn.filter(n=>n.people&&n.people.length>0);
    const withoutPeople=fn.filter(n=>!n.people||n.people.length===0);

    // Group by person
    const personGroups={};
    const usedNoteIds=new Set();
    withPeople.forEach(n=>{
        (n.people||[]).forEach(pid=>{
            if(!personGroups[pid]) personGroups[pid]=[];
            if(!personGroups[pid].find(x=>x.id===n.id)){
                personGroups[pid].push(n);
                usedNoteIds.add(n.id);
            }
        });
    });

    let html='';

    // Render person groups side by side in grid
    const personIds=Object.keys(personGroups).map(Number);
    personIds.sort((a,b)=>{
        const ca=contacts.find(x=>x.id===a),cb=contacts.find(x=>x.id===b);
        return (ca?ca.name:'').localeCompare(cb?cb.name:'');
    });

    if(personIds.length){
        html+='<div class="person-groups-grid">';
        personIds.forEach(pid=>{
            const c=contacts.find(x=>x.id===pid);
            if(!c) return;
            const col=getAvatarColor(c.name);
            const _pgHasPhoto=c.avatar&&(c.avatar.startsWith('data:')||c.avatar.length<=8);
            const _pgAvatarInner=_pgHasPhoto?getAvatarHTML(c,'md'):getInitials(c.name);
            const _pgAvatarBg=(c.avatar&&!c.avatar.startsWith('data:')&&c.avatar.length<=8)?'rgba(255,255,255,0.1)':col;
            const groupNotes=[...personGroups[pid]].sort(sortFn);
            html+=`<div class="person-group">
                <div class="person-group-header">
                    <div class="pg-avatar ${_pgHasPhoto?'has-photo':''}" style="background:${_pgAvatarBg}">${_pgAvatarInner}</div>
                    <div class="pg-name">${c.name}</div>
                    <div class="pg-count">${groupNotes.length} nota${groupNotes.length!==1?'s':''}</div>
                </div>
                <div class="person-group-list">${groupNotes.map(n=>renderNoteCard(n)).join('')}</div>
            </div>`;
        });
        html+='</div>';
    }

    // Render ungrouped notes (sin persona) in the grid
    const ungrouped=[...withoutPeople].sort(sortFn);
    if(ungrouped.length){
        if(personIds.length) html+=`<div style="margin-top:8px;margin-bottom:14px;padding:8px 0;border-top:2px solid var(--gray2);"><span style="font-family:var(--serif);font-size:0.88em;color:var(--gray4);font-weight:600;">Sin persona asignada</span></div>`;
        html+=`<div class="notes-list">${ungrouped.map(n=>renderNoteCard(n)).join('')}</div>`;
    }

    nl.innerHTML=html;
}

function updateTicker(){
    const t=new Date(),y=t.getFullYear(),ts=`${y}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    const tn=getRelevantNotes(ts,y),tp=tn.filter(n=>!n.isRecurring&&!n.completed),tr=tn.filter(n=>n.isRecurring),h=holidays[ts];
    let tk='';
    if(h) tk+=`<span class="ticker-item"><span class="ticker-icon">\ud83c\udf89</span>Hoy es ${h}</span>`;
    tr.forEach(n=>{tk+=`<span class="ticker-item"><span class="ticker-icon">\ud83c\udf82</span>${n.title}</span>`;});
    tp.forEach(n=>{tk+=`<span class="ticker-item"><span class="ticker-icon">\ud83d\udccc</span>${n.title}</span>`;});
    if(!h&&!tn.length) tk='<span class="ticker-item"><span class="ticker-icon">\u2728</span>No hay eventos pendientes para hoy</span>';
    document.getElementById('tickerContent').innerHTML=tk;
}

function checkTodayAlerts(){
    const t=new Date(),y=t.getFullYear(),ts=`${y}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    const tn=getRelevantNotes(ts,y),bd=tn.filter(n=>n.isRecurring),pt=tn.filter(n=>!n.isRecurring&&!n.completed),h=holidays[ts];
    let a='';
    if(h) a+=`\ud83c\udf89 HOY ES FERIADO: ${h}\n\n`;
    if(bd.length){a+='EVENTOS RECURRENTES:\n';bd.forEach(b=>{a+=`  \ud83c\udf82 ${b.title} - ${b.desc}\n`;});a+='\n';}
    if(pt.length){a+='TAREAS PENDIENTES:\n';pt.forEach(t=>{a+=`  \u2022 ${t.title}\n`;});}
    if(a) setTimeout(()=>alert(a),500);
}

function closeModal(){document.getElementById('noteModal').classList.remove('open');}

function goToMonth(year, month){
    currentDate=new Date(year, month, 1);
    renderCalendar();
    window.scrollTo({top:document.getElementById('notesList').offsetTop-20,behavior:'smooth'});
}

function showAllNotes(){
    const nl=document.getElementById('notesList');
    if(!notes.length){nl.innerHTML='<p style="text-align:center;color:var(--gray3);padding:40px;">Sin registros aún.</p>';return;}
    const sortFn=(a,b)=>new Date(b.date)-new Date(a.date);
    const sorted=[...notes].sort(sortFn);
    // Group by person
    const personGroups={};
    sorted.forEach(n=>{
        (n.people||[]).forEach(pid=>{
            if(!personGroups[pid]) personGroups[pid]=[];
            if(!personGroups[pid].find(x=>x.id===n.id)) personGroups[pid].push(n);
        });
    });
    const ungrouped=sorted.filter(n=>!n.people||!n.people.length);
    let html=`<div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <span style="font-family:var(--serif);font-size:0.95em;color:var(--blue1);font-weight:700;">📋 Todos los registros (${notes.length})</span>
        <button onclick="renderCalendar()" style="background:var(--blue2);color:#fff;border:none;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:0.82em;font-weight:600;">← Volver al mes actual</button>
    </div>`;
    const personIds=Object.keys(personGroups).map(Number);
    personIds.sort((a,b)=>{const ca=contacts.find(x=>x.id===a),cb=contacts.find(x=>x.id===b);return(ca?ca.name:'').localeCompare(cb?cb.name:'');});
    if(personIds.length){
        html+='<div class="person-groups-grid">';
        personIds.forEach(pid=>{
            const c=contacts.find(x=>x.id===pid);if(!c) return;
            const col=getAvatarColor(c.name);
            const _pgHasPhoto2=c.avatar&&(c.avatar.startsWith('data:')||c.avatar.length<=8);
            const _pgAvatarInner2=_pgHasPhoto2?getAvatarHTML(c,'md'):getInitials(c.name);
            const _pgAvatarBg2=(c.avatar&&!c.avatar.startsWith('data:')&&c.avatar.length<=8)?'rgba(255,255,255,0.1)':col;
            const gn=personGroups[pid];
            html+=`<div class="person-group">
                <div class="person-group-header">
                    <div class="pg-avatar ${_pgHasPhoto2?'has-photo':''}" style="background:${_pgAvatarBg2}">${_pgAvatarInner2}</div>
                    <div class="pg-name">${c.name}</div>
                    <div class="pg-count">${gn.length} nota${gn.length!==1?'s':''}</div>
                </div>
                <div class="person-group-list">${gn.map(n=>renderNoteCard(n)).join('')}</div>
            </div>`;
        });
        html+='</div>';
    }
    if(ungrouped.length) html+=`<div class="notes-list">${ungrouped.map(n=>renderNoteCard(n)).join('')}</div>`;
    nl.innerHTML=html;
}

function showDayNotes(ds){
    const cy=currentDate.getFullYear(),dn=getRelevantNotes(ds,cy),h=holidays[ds];
    if(!dn.length&&!h){document.getElementById('noteDate').value=ds;document.querySelector('.note-form').scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('noteTitle').focus();return;}
    const df=new Date(ds+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    document.getElementById('modalTitle').textContent=`Detalles del ${df}`;
    let mb='';
    if(h) mb+=`<div style="background:var(--purple-light);padding:16px;border-radius:var(--radius-sm);margin-bottom:18px;border:2px solid var(--purple1);text-align:center;"><h3 style="color:var(--purple1);margin:0;font-family:var(--serif);">\ud83c\udf89 FERIADO NACIONAL</h3><p style="font-size:1.05em;color:var(--gray4);margin-top:5px;">${h}</p></div>`;
    if(dn.length){
        const sd=dn.sort((a,b)=>{if(a.isRecurring!==b.isRecurring) return a.isRecurring?-1:1;if(a.completed!==b.completed) return a.completed?1:-1;return 0;});
        mb+=`<div style="display:grid;gap:14px;">${sd.map(n=>renderNoteCard(n)).join('')}</div>`;
    }else if(h) mb+='<p style="text-align:center;color:var(--gray3);padding:20px;">Disfruta el feriado! \ud83c\udfd6\ufe0f</p>';
    document.getElementById('modalBody').innerHTML=mb;
    document.getElementById('noteModal').classList.add('open');
}

// INIT
const _id=new Date();document.getElementById('noteDate').value=_id.getFullYear()+'-'+String(_id.getMonth()+1).padStart(2,'0')+'-'+String(_id.getDate()).padStart(2,'0');
updateTitlePlaceholder();
renderCalendar();updateTicker();checkTodayAlerts();initStickerPicker();

// ======= CLOUD SYNC INIT =======
function jumpToLatestMonth(){
    // Si el mes actual no tiene notas, salta al mes más reciente con notas
    const cy=currentDate.getFullYear(),cm=currentDate.getMonth()+1,cms=String(cm).padStart(2,'0');
    const currentHasNotes=notes.some(n=>{
        if(!n.date) return false;
        return (n.date.substring(5,7)===cms&&n.date.substring(0,4)==String(cy))||(n.isRecurring&&n.date.substring(5,7)===cms);
    });
    if(!currentHasNotes&&notes.length){
        const latest=notes.filter(n=>n.date&&!n.isRecurring).sort((a,b)=>b.date.localeCompare(a.date))[0];
        if(latest){const[y,m]=latest.date.split('-');currentDate=new Date(parseInt(y),parseInt(m)-1,1);}
    }
}

async function manualSync() {
    const loaded = await cloudLoad();
    if (loaded) {
        jumpToLatestMonth();
        renderCalendar();
        renderNotes();
        renderContacts();
        updateTicker();
    }
}

// Auto-load al iniciar, luego solo SUBE datos \u2014 nunca baja autom\u00e1ticamente
// (evita sobreescribir notas reci\u00e9n agregadas antes de que lleguen al cloud)
(async function initCloud() {
    if (!SHEET_URL) {
        setSyncStatus('local');
        return;
    }
    // Carga inicial \u00fanica desde el cloud
    const loaded = await cloudLoad();
    if (loaded) {
        jumpToLatestMonth();
        renderCalendar();
        renderNotes();
        renderContacts();
        updateTicker();
    }
    // Cada 30s solo verifica si hay cambios PENDIENTES de subir (no baja datos)
    // Para bajar datos del cloud usa el bot\u00f3n "Sincronizar"
    syncInterval = setInterval(async () => {
        if (pendingSaves > 0) {
            // Hay un guardado en cola \u2014 reintenta subir
            await cloudSave();
        }
    }, 30000);
})();

// ======= SERVICE WORKER (PWA) =======
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(reg => {
        // Detecta nueva versión y recarga automáticamente
        reg.addEventListener('updatefound', () => {
            const w = reg.installing;
            w.addEventListener('statechange', () => {
                if (w.state === 'activated' && navigator.serviceWorker.controller) {
                    window.location.reload();
                }
            });
        });
    });
}
